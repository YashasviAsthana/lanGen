[project]
name = "langen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "ddgs>=9.14.1",
    "pydantic>=2.0",
    "pillow>=10.0",
    "pypdf>=4.0",
    "pyyaml>=6.0.1",
    "websockets>=12.0",
    "trafilatura>=1.9",
    "html2text>=2024.2",
    "mcp>=1.30,<2",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]
exclude = ["chats/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "C90",    # mccabe complexity
]
ignore = [
    "E501",   # line length — handled by formatter
    "SIM108", # use ternary — stylistic
    "SIM115", # context manager for open — log handles need to outlive `with`
    "C901",   # McCabe complexity — inherent in agentic loop, not a quality signal
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["chats/"]

[[tool.mypy.overrides]]
module = ["agent", "setup"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
